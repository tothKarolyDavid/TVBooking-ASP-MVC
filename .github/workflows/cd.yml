name: CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Configure azd to use Azure CLI auth
        run: azd config set auth.useAzCliAuth "true"

      - name: Resolve Azure subscription for azd
        shell: bash
        run: |
          AZURE_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          test -n "${AZURE_SUBSCRIPTION_ID}"
          echo "AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID}" >> "$GITHUB_ENV"

      - name: Provision + deploy with azd
        run: azd up --no-prompt
        env:
          AZURE_ENV_NAME: tvbooking-${{ github.run_id }}
          AZURE_LOCATION: polandcentral
